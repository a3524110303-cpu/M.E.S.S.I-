name: MESSI web y permisos
on: [push, pull_request]
permissions:
  contents: read
jobs:
  mysql-web:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: messi_web_ci
          MYSQL_ROOT_PASSWORD: messi_ci_ephemeral_only
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pmessi_ci_ephemeral_only"
          --health-interval=10s --health-timeout=5s --health-retries=15
    env:
      MESSI_WEB_ENV: development
      MESSI_WEB_DB_HOST: 127.0.0.1
      MESSI_WEB_DB_PORT: '3306'
      MESSI_WEB_DB_NAME: messi_web_ci
      MESSI_WEB_DB_USER: root
      MESSI_WEB_DB_PASSWORD: messi_ci_ephemeral_only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: cloud/requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y default-libmysqlclient-dev pkg-config
      - run: python -m pip install -r cloud/requirements.txt
      - run: python scripts/train_demo.py
      - run: python web/manage.py migrate --noinput
      - run: python web/manage.py makemigrations --check --dry-run
      - run: python web/manage.py test portal.tests cloud.tests --noinput
      - run: python -m compileall -q web cloud scripts/respaldo_web.py
      - name: Construir imagen web
        run: docker build -f Dockerfile.web -t messi-web-ci .
